# Раздача собранного React и прокси на бэкенд внутри сети Docker

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Бэкенд принимает документы до 10 МБ, плюс запас на multipart
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Для healthcheck контейнера
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # API, админка и её статика (whitenoise в бэкенде) идут в Django
    location = /admin {
        return 301 /admin/;
    }
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        # Host с портом: Django сверяет его с ALLOWED_HOSTS и Origin для CSRF в админке
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Локально конвейер может идти в запросе несколько секунд (моки с повторами)
        proxy_read_timeout 60s;
    }

    # Файлы сборки с хешем в имени: кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: любой другой путь отдаёт index.html, маршрут разбирает React Router.
    # index.html не кэшируем, чтобы после пересборки браузер сразу взял новые файлы
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}