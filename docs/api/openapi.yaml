openapi: 3.0.3
info:
  title: SME Credit API
  version: 1.0.0
paths:
  /api/v1/applications:
    get:
      operationId: applications_list
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationRetrieve'
          description: ''
    post:
      operationId: applications_create
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCreate'
          description: ''
  /api/v1/applications/{id}:
    get:
      operationId: applications_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRetrieve'
          description: ''
    patch:
      operationId: applications_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApplicationPatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApplicationPatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApplicationPatch'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPatch'
          description: ''
  /api/v1/applications/{id}/cancel:
    post:
      operationId: applications_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRetrieve'
          description: ''
  /api/v1/applications/{id}/documents:
    post:
      operationId: applications_documents_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDocumentUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplicationDocumentUpload'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationDocumentUpload'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDocumentUpload'
          description: ''
  /api/v1/applications/{id}/documents/{doc_id}:
    delete:
      operationId: applications_documents_destroy
      parameters:
      - in: path
        name: doc_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/applications/{id}/documents/{doc_id}/file:
    get:
      operationId: applications_documents_file_retrieve
      parameters:
      - in: path
        name: doc_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/applications/{id}/events:
    get:
      operationId: applications_events_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationEvent'
          description: ''
  /api/v1/applications/{id}/info-requests/{info_id}/answer:
    post:
      operationId: applications_info_requests_answer_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      - in: path
        name: info_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfoRequested'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InfoRequested'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InfoRequested'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRetrieve'
          description: ''
  /api/v1/applications/{id}/offer/accept:
    post:
      operationId: applications_offer_accept_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRetrieve'
          description: ''
  /api/v1/applications/{id}/offer/decline:
    post:
      operationId: applications_offer_decline_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRetrieve'
          description: ''
  /api/v1/applications/{id}/sign:
    post:
      operationId: applications_sign_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRetrieve'
          description: ''
  /api/v1/applications/{id}/submit:
    post:
      operationId: applications_submit_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRetrieve'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/calculator:
    post:
      operationId: calculator_create
      tags:
      - calculator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculatorInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CalculatorInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CalculatorInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculatorResult'
          description: ''
  /api/v1/companies:
    post:
      operationId: companies_create
      description: |-
        Привязать компанию к клиенту.

        Данные компании сервер берёт сам из ЕГРЮЛ и «Прозрачного бизнеса», запросу не доверяет.
        tax_regime из запроса нужен, только если «Прозрачный бизнес» не ответил.
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
        '400':
          description: Неверный ИНН или не указан налоговый режим
        '404':
          description: ИНН не найден в ЕГРЮЛ/ЕГРИП
        '409':
          description: У пользователя уже есть компания или ИНН занят
        '503':
          description: ЕГРЮЛ недоступен
  /api/v1/companies/lookup:
    get:
      operationId: companies_lookup_retrieve
      description: 'Автозаполнение на первом шаге заявки: данные компании по ИНН и
        быстрые стоп-факторы.'
      parameters:
      - in: query
        name: inn
        schema:
          type: string
        description: 10 цифр у ООО, 12 у ИП
        required: true
      tags:
      - companies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyLookup'
          description: ''
        '400':
          description: Неверный формат ИНН
        '404':
          description: ИНН не найден в ЕГРЮЛ/ЕГРИП
        '503':
          description: ЕГРЮЛ недоступен
  /api/v1/health:
    get:
      operationId: health_retrieve
      description: 'Жив ли бэкенд: доступны ли база и Redis. Без входа — его опрашивает
        healthcheck Docker.'
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/products:
    get:
      operationId: products_list
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{code}:
    get:
      operationId: products_retrieve
      parameters:
      - in: path
        name: code
        schema:
          type: string
          title: Код
          description: Постоянный идентификатор латиницей, например EXPRESS. Не меняется,
            если на продукт есть заявки
        required: true
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{code}/documents:
    get:
      operationId: products_documents_list
      parameters:
      - in: path
        name: code
        schema:
          type: string
          title: Код
          description: Постоянный идентификатор латиницей, например EXPRESS. Не меняется,
            если на продукт есть заявки
        required: true
      - in: query
        name: legal_form
        schema:
          enum:
          - IP
          - OOO
          type: string
          minLength: 1
        description: |-
          * `IP` - ИП
          * `OOO` - ООО
        required: true
      - in: query
        name: tax_regime
        schema:
          enum:
          - OSNO
          - USN_INCOME
          - USN_INCOME_EXPENSES
          - PSN
          - ESHN
          - AUSN
          type: string
          minLength: 1
        description: |-
          * `OSNO` - ОСНО
          * `USN_INCOME` - УСН «Доходы»
          * `USN_INCOME_EXPENSES` - УСН «Доходы минус расходы»
          * `PSN` - Патент (только ИП)
          * `ESHN` - ЕСХН
          * `AUSN` - АУСН
        required: true
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentRequirement'
          description: ''
  /api/v1/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/underwriting/applications/{id}:
    get:
      operationId: underwriting_applications_retrieve
      description: |-
        Карточка заявки и действия андеррайтера: взять в работу, принять решение.

        Это вьюсет, а не RetrieveAPIView: @action работает только во вьюсетах, подключённых через роутер.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      tags:
      - underwriting
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnderwritingCard'
          description: ''
  /api/v1/underwriting/applications/{id}/decision:
    post:
      operationId: underwriting_applications_decision_create
      description: |-
        Карточка заявки и действия андеррайтера: взять в работу, принять решение.

        Это вьюсет, а не RetrieveAPIView: @action работает только во вьюсетах, подключённых через роутер.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      tags:
      - underwriting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnderwriterDecision'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UnderwriterDecision'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UnderwriterDecision'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnderwritingCard'
          description: ''
  /api/v1/underwriting/applications/{id}/take:
    post:
      operationId: underwriting_applications_take_create
      description: Взять заявку в работу. Повторно тем же андеррайтером — не ошибка.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        required: true
      tags:
      - underwriting
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnderwritingCard'
          description: ''
  /api/v1/underwriting/queue:
    get:
      operationId: underwriting_queue_list
      description: Заявки, которые ждут решения андеррайтера. Старые сверху.
      tags:
      - underwriting
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueItem'
          description: ''
components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    ActorTypeEnum:
      enum:
      - CLIENT
      - UNDERWRITER
      - SYSTEM
      type: string
      description: |-
        * `CLIENT` - Клиент
        * `UNDERWRITER` - Андеррайтер
        * `SYSTEM` - Система
    Agreement:
      type: object
      properties:
        number:
          type: string
          title: Номер договора
          description: Например, КД-20261024-3F9A1C
          maxLength: 32
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          title: Сумма кредита, ₽
        term_months:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Срок, мес.
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          title: Ставка, % годовых
        monthly_payment:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          title: Платёж в месяц, ₽
        signed_at:
          type: string
          format: date-time
          readOnly: true
          title: Подписан
        disbursed_at:
          type: string
          format: date-time
          nullable: true
          title: Деньги зачислены
          description: Пусто, пока идёт выдача
      required:
      - amount
      - monthly_payment
      - number
      - rate
      - signed_at
      - term_months
    ApplicationCreate:
      type: object
      properties:
        product_code:
          type: string
          title: Код
          description: Постоянный идентификатор латиницей, например EXPRESS. Не меняется,
            если на продукт есть заявки
      required:
      - product_code
    ApplicationDocument:
      type: object
      description: Сведения о загруженном документе для ответа клиенту (без самого
        файла).
