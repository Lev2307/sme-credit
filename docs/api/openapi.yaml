          description: Исправленная выручка за год
        existing_monthly_payments:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Исправленные платежи по другим кредитам
      required:
      - answer
    LegalFormEnum:
      enum:
      - IP
      - OOO
      type: string
      description: |-
        * `IP` - ИП
        * `OOO` - ООО
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Адрес электронной почты
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          title: Роль
          description: |-
            Клиент подаёт заявки, андеррайтер разбирает их вручную

            * `CLIENT` - Клиент
            * `UNDERWRITER` - Андеррайтер
        company:
          allOf:
          - $ref: '#/components/schemas/Company'
          readOnly: true
          nullable: true
      required:
      - company
      - id
      - username
    NullEnum:
      enum:
      - null
    Offer:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        term_months:
          type: integer
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        monthly_payment:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        reason_codes:
          type: array
          items:
            type: string
      required:
      - amount
      - monthly_payment
      - rate
      - reason_codes
      - term_months
    OpenInfoRequest:
      type: object
      description: Вопрос банка, который клиент видит в заявке.
      properties:
        id:
          type: integer
          readOnly: true
        asked_by:
          allOf:
          - $ref: '#/components/schemas/DecisionMakerEnum'
          readOnly: true
          title: Кто спросил
          description: |-
            После ответа заявка вернётся к нему: системе — на пересчёт, андеррайтеру — в очередь

            * `SYSTEM` - Система
            * `UNDERWRITER` - Андеррайтер
        question:
          type: string
          readOnly: true
          title: Вопрос
          description: Что банк просит уточнить — простыми словами
        doc_types:
          readOnly: true
          title: Какие документы приложить
          description: Коды из DocTypeChoices
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Спросили
      required:
      - asked_by
      - created_at
      - doc_types
      - id
      - question
    PatchedApplicationPatch:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
          title: Сумма кредита, ₽
        term_months:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          nullable: true
          title: Срок, мес.
        purpose:
          type: string
          title: Цель кредита
          description: 'Своими словами: на что нужны деньги'
        annual_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
          title: Выручка за год, ₽
          description: Со слов клиента. При проверке сверяется с отчётностью из «Прозрачного
            бизнеса»
        existing_monthly_payments:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
          title: Платежи по другим кредитам в месяц, ₽
          description: Нужны для расчёта долговой нагрузки. 0, если других кредитов
            нет
        collateral_type:
          title: Вид залога
          description: |-
            Только для продуктов с залогом

            * `REAL_ESTATE` - Недвижимость
            * `VEHICLE` - Транспорт
            * `EQUIPMENT` - Оборудование
          oneOf:
          - $ref: '#/components/schemas/CollateralTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        collateral_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
          title: Стоимость залога, ₽
          description: Кредит не может быть больше этой суммы, умноженной на max_ltv
            продукта
        consent:
          type: boolean
          writeOnly: true
    Product:
      type: object
      properties:
        code:
          type: string
          title: Код
          description: Постоянный идентификатор латиницей, например EXPRESS. Не меняется,
            если на продукт есть заявки
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          title: Название
          maxLength: 64
        description:
          type: string
          title: Описание
          description: 'Простыми словами: на что этот кредит'
        min_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          title: Минимальная сумма, ₽
        max_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          title: Максимальная сумма, ₽
        max_term_months:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Максимальный срок, мес.
          description: У продуктов MVP от 24 до 60 месяцев
        base_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          title: Базовая ставка, % годовых
          description: Ставка для лучшего класса риска. Для класса B к ней добавляется
            надбавка
        requires_collateral:
          type: boolean
          title: Нужен залог
        max_ltv:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          nullable: true
          title: Максимальный LTV
          description: 'Loan-to-value: какую долю стоимости залога можно выдать кредитом.
            0.70 — под залог на 10 млн дадут не больше 7 млн. Пусто у продуктов без
            залога'
        min_business_age_months:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Минимальный возраст бизнеса, мес.
          description: Если бизнес моложе, заявка получает отказ по стоп-фактору
      required:
      - base_rate
      - code
      - description
      - max_amount
      - max_term_months
      - min_amount
      - min_business_age_months
      - title
    QueueItem:
      type: object
      description: 'Строка очереди андеррайтера: что за заявка, кто её разбирает и
        почему она здесь.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        company_name:
          type: string
          readOnly: true
        company_inn:
          type: string
          readOnly: true
        product_code:
          type: string
          readOnly: true
        product_title:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          title: Сумма кредита, ₽
        term_months:
          type: integer
          readOnly: true
          nullable: true
          title: Срок, мес.
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Подана
          description: Когда клиент первый раз отправил заявку
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Изменена
        assigned_to:
          type: string
          readOnly: true
          nullable: true
        reason_codes:
          type: array
          items:
            type: string
          description: 'Почему заявка у андеррайтера: причины последнего решения системы.'
          readOnly: true
      required:
      - amount
      - assigned_to
      - company_inn
      - company_name
      - id
      - product_code
      - product_title
      - reason_codes
      - submitted_at
      - term_months
      - updated_at
    RoleEnum:
      enum:
      - CLIENT
      - UNDERWRITER
      type: string
      description: |-
        * `CLIENT` - Клиент
        * `UNDERWRITER` - Андеррайтер
    SourceEnum:
      enum:
      - EGRUL
      - TB
      - BKI
      type: string
      description: |-
        * `EGRUL` - ЕГРЮЛ/ЕГРИП
        * `TB` - Прозрачный бизнес
        * `BKI` - БКИ
    StopFactor:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    TaxRegimeEnum:
      enum:
      - OSNO
      - USN_INCOME
      - USN_INCOME_EXPENSES
      - PSN
      - ESHN
      - AUSN
      type: string
      description: |-
        * `OSNO` - ОСНО
        * `USN_INCOME` - УСН «Доходы»
        * `USN_INCOME_EXPENSES` - УСН «Доходы минус расходы»
        * `PSN` - Патент (только ИП)
        * `ESHN` - ЕСХН
        * `AUSN` - АУСН
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    UnderwriterDecision:
      type: object
      description: Что присылает андеррайтер. Сумма и срок нужны только для оффера,
        вопрос — только для дозапроса.
      properties:
        outcome:
          $ref: '#/components/schemas/UnderwriterDecisionOutcomeEnum'
        comment:
          type: string
          description: Почему такое решение. Обязательно — попадёт в журнал
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        term_months:
          type: integer
          minimum: 1
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: По умолчанию — базовая ставка продукта
        question:
          type: string
          description: 'Для дозапроса: что спросить у клиента'
        doc_types:
          type: array
          items:
            $ref: '#/components/schemas/DocTypeEnum'
          description: 'Для дозапроса: какие документы приложить'
      required:
      - comment
      - outcome
    UnderwriterDecisionOutcomeEnum:
      enum:
      - APPROVE
      - COUNTER_OFFER
      - INFO_REQUEST
      - REJECT
      type: string
      description: |-
        * `APPROVE` - APPROVE
        * `COUNTER_OFFER` - COUNTER_OFFER
        * `INFO_REQUEST` - INFO_REQUEST
        * `REJECT` - REJECT
    UnderwritingCard:
      type: object
      description: 'Карточка заявки для андеррайтера: анкета, компания, документы,
        источники, решения, журнал.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          title: Номер заявки
          description: UUID, чтобы номера заявок нельзя было подобрать перебором
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
          title: Статус
          description: |-
            Меняется только через transitions.py

            * `DRAFT` - Черновик
            * `IN_REVIEW` - На проверке
            * `UNDERWRITING` - У андеррайтера
            * `INFO_REQUESTED` - Дозапрос
            * `APPROVED` - Одобрено
            * `COUNTER_OFFER` - Контрпредложение
            * `REJECTED` - Отказ
            * `AWAITING_SIGNATURE` - Ожидает подписания
            * `DISBURSING` - Выдача
            * `DISBURSED` - Выдано
            * `CANCELLED` - Отменена
        status_display:
          type: string
          readOnly: true
        product_code:
          type: string
          readOnly: true
        product_title:
          type: string
          readOnly: true
        assigned_to:
          type: string
          readOnly: true
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          title: Сумма кредита, ₽
        term_months:
          type: integer
          readOnly: true
          nullable: true
          title: Срок, мес.
        purpose:
          type: string
          readOnly: true
          title: Цель кредита
          description: 'Своими словами: на что нужны деньги'
        annual_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          title: Выручка за год, ₽
          description: Со слов клиента. При проверке сверяется с отчётностью из «Прозрачного
            бизнеса»
        existing_monthly_payments:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          title: Платежи по другим кредитам в месяц, ₽
          description: Нужны для расчёта долговой нагрузки. 0, если других кредитов
            нет
        collateral_type:
          allOf:
          - $ref: '#/components/schemas/CollateralTypeEnum'
          readOnly: true
          title: Вид залога
          description: |-
            Только для продуктов с залогом

            * `REAL_ESTATE` - Недвижимость
            * `VEHICLE` - Транспорт
            * `EQUIPMENT` - Оборудование
        collateral_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          title: Стоимость залога, ₽
          description: Кредит не может быть больше этой суммы, умноженной на max_ltv
            продукта
        info_request_rounds:
          type: integer
          readOnly: true
          title: Число раундов дозапроса
          description: Сколько раз у клиента уже что-то запрашивали. После двух раундов
            заявка уходит андеррайтеру
        consent_given_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Согласие дано
          description: 'Когда клиент согласился на запрос кредитной истории в БКИ
            и обработку данных. Без согласия заявку нельзя подать: банк не вправе
            запрашивать кредитную историю'
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Подана
          description: Когда клиент первый раз отправил заявку
        version:
          type: integer
          readOnly: true
          title: Версия
          description: 'Растёт при каждом изменении статуса. Нужна, чтобы два одновременных
            изменения не затёрли друг друга: второе получит 409'
        company:
          allOf:
          - $ref: '#/components/schemas/Company'
          readOnly: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationDocument'
          readOnly: true
        enrichment_results:
          type: array
          items:
            $ref: '#/components/schemas/EnrichmentResult'
          readOnly: true
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
          readOnly: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationEvent'
          readOnly: true
        agreement:
          allOf:
          - $ref: '#/components/schemas/Agreement'
          readOnly: true
          nullable: true
      required:
      - agreement
      - amount
      - annual_revenue
      - assigned_to
      - collateral_type
      - collateral_value
      - company
      - consent_given_at
      - decisions
      - documents
      - enrichment_results
      - events
      - existing_monthly_payments
      - id
      - info_request_rounds
      - product_code
      - product_title
      - purpose
      - status
      - status_display
      - submitted_at
      - term_months
      - version
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
