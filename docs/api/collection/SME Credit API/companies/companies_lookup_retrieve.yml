info:
  name: companies_lookup_retrieve
  type: http
  seq: 2
  tags:
    - companies

http:
  method: GET
  url: "{{baseUrl}}/api/v1/companies/lookup"
  params:
    - name: inn
      value: ""
      type: query
      description: 10 цифр у ООО, 12 у ИП
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/companies/lookup"
      method: GET
      params:
        - name: inn
          value: ""
          type: query
          description: 10 цифр у ООО, 12 у ИП
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "inn": "",
            "name": "",
            "ogrn": "",
            "legal_form": "IP",
            "registered_at": "",
            "address": "",
            "director_name": "",
            "okved_name": "",
            "tax_regime": "",
            "stop_factors": [
              {
                "code": "",
                "message": ""
              }
            ]
          }
  - name: 400 Response
    description: Неверный формат ИНН
    request:
      url: "{{baseUrl}}/api/v1/companies/lookup"
      method: GET
      params:
        - name: inn
          value: ""
          type: query
          description: 10 цифр у ООО, 12 у ИП
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 404 Response
    description: ИНН не найден в ЕГРЮЛ/ЕГРИП
    request:
      url: "{{baseUrl}}/api/v1/companies/lookup"
      method: GET
      params:
        - name: inn
          value: ""
          type: query
          description: 10 цифр у ООО, 12 у ИП
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
  - name: 503 Response
    description: ЕГРЮЛ недоступен
    request:
      url: "{{baseUrl}}/api/v1/companies/lookup"
      method: GET
      params:
        - name: inn
          value: ""
          type: query
          description: 10 цифр у ООО, 12 у ИП
    response:
      status: 503
      statusText: Service Unavailable
      body:
        type: text
        data: ""

docs: "Автозаполнение на первом шаге заявки: данные компании по ИНН и быстрые стоп-факторы."
