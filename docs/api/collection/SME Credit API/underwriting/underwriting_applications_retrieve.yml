info:
  name: underwriting_applications_retrieve
  type: http
  seq: 1
  tags:
    - underwriting

http:
  method: GET
  url: "{{baseUrl}}/api/v1/underwriting/applications/{{appId}}"
  auth:
    type: bearer
    token: "{{uwToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/underwriting/applications/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
