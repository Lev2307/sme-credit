    request:
      url: "{{baseUrl}}/api/v1/underwriting/queue"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "company_name": "",
              "company_inn": "",
              "product_code": "",
              "product_title": "",
              "amount": "",
              "term_months": 0,
              "submitted_at": "",
              "updated_at": "",
              "assigned_to": "",
              "reason_codes": []
            }
          ]

