info:
  name: underwriting_queue_list
  type: http
  seq: 4
  tags:
    - underwriting

http:
  method: GET
  url: "{{baseUrl}}/api/v1/underwriting/queue"
  auth:
    type: bearer
    token: "{{uwToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
