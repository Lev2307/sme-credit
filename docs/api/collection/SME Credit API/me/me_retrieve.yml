info:
  name: me_retrieve
  type: http
  seq: 1
  tags:
    - me

http:
  method: GET
  url: "{{baseUrl}}/api/v1/me"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "username": "",
            "email": "",
            "first_name": "",
            "last_name": "",
            "role": "",
            "company": ""
          }
