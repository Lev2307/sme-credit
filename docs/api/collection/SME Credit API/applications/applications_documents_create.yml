info:
  name: applications_documents_create
  type: http
  seq: 6
  tags:
    - applications

http:
  method: POST
  url: "{{baseUrl}}/api/v1/applications/{{appId}}/documents"
  body:
    type: multipart-form
    data:
      - name: doc_type
        type: text
        value: BANK_STATEMENT
      - name: file
        type: file
        value:
          - fixtures/sample.pdf
        contentType: application/pdf
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("docId", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/applications/:id/documents"
      method: POST
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "id": 0,
            "doc_type": "",
            "file": "",
            "original_name": "",
            "size": 0,
            "uploaded_at": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "doc_type": "",
            "file": "",
            "original_name": "",
            "size": 0,
            "uploaded_at": ""
          }
