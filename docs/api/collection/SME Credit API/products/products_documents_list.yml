        * `USN_INCOME` - УСН «Доходы»
        * `USN_INCOME_EXPENSES` - УСН «Доходы минус расходы»
        * `PSN` - Патент (только ИП)
        * `ESHN` - ЕСХН
        * `AUSN` - АУСН
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

