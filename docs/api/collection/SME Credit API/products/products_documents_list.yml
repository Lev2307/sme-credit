        * `USN_INCOME_EXPENSES` - УСН «Доходы минус расходы»
        * `PSN` - Патент (только ИП)
        * `ESHN` - ЕСХН
        * `AUSN` - АУСН
      disabled: true
    - name: tax_regime
      value: AUSN
      type: query
      description: |-
