info:
  name: products_retrieve
  type: http
  seq: 2
  tags:
    - products

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/:code"
  params:
    - name: code
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/products/:code"
      method: GET
      params:
        - name: code
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "title": "",
            "description": "",
            "min_amount": "",
            "max_amount": "",
            "max_term_months": 0,
            "base_rate": "",
            "requires_collateral": false,
            "max_ltv": "",
            "min_business_age_months": 0
          }
