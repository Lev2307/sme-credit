info:
  name: calculator_create
  type: http
  seq: 1
  tags:
    - calculator

http:
  method: POST
  url: "{{baseUrl}}/api/v1/calculator"
  body:
    type: json
    data: |-
      {
        "product_code": "",
        "amount": "",
        "term_months": 0
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/calculator"
      method: POST
      body:
        type: json
        data: |-
          {
            "product_code": "",
            "amount": "",
            "term_months": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "rate": "",
            "monthly_payment": "",
            "total_payment": "",
            "overpayment": ""
          }
